<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ការអានភាសាខ្មែរ ថ្នាក់ទី៣</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1E2F27;
    --panel: #24392F;
    --paper: #FBF7EA;
    --ink: #2B2B26;
    --muted: #A9BDB1;
    --letters: #F2C94C;
    --blending: #7EC8E3;
    --words: #F4978E;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    font-family: 'Noto Sans Khmer', sans-serif;
    color: var(--paper);
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    padding: 20px clamp(16px, 4vw, 48px);
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
  }

  .title {
    font-size: clamp(16px, 2vw, 20px);
    font-weight: 500;
    color: var(--muted);
  }

  .level-tabs {
    display: flex;
    gap: 8px;
  }

  .tab {
    font-family: inherit;
    font-size: clamp(15px, 1.8vw, 18px);
    font-weight: 500;
    color: var(--muted);
    background: transparent;
    border: none;
    border-bottom: 3px solid transparent;
    padding: 8px 6px;
    cursor: pointer;
  }

  .tab.active { color: var(--paper); }
  .tab[data-level="letters"].active { border-color: var(--letters); }
  .tab[data-level="blending"].active { border-color: var(--blending); }
  .tab[data-level="words"].active { border-color: var(--words); }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    min-height: 0;
  }

  .hint {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: clamp(14px, 1.6vw, 16px);
    color: var(--muted);
  }

  .hint svg { flex-shrink: 0; opacity: 0.8; }

  .chip-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .chip {
    font-family: inherit;
    font-size: clamp(18px, 2.4vw, 24px);
    background: rgba(255,255,255,0.06);
    color: var(--paper);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 10px;
    padding: 8px 18px;
    cursor: pointer;
  }

  .chip.active {
    background: var(--blending);
    color: #123;
    border-color: var(--blending);
    font-weight: 500;
  }

  .stage {
    background: var(--paper);
    color: var(--ink);
    border-radius: 20px;
    width: min(90vw, 720px);
    height: min(46vh, 420px);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 12px 0 rgba(0,0,0,0.18);
    cursor: default;
  }

  .stage.clickable { cursor: pointer; }

  .stage-text {
    font-size: clamp(70px, 22vw, 220px);
    font-weight: 700;
    line-height: 1;
    text-align: center;
    padding: 0 20px;
  }

  .stage-text.words-size {
    font-size: clamp(50px, 12vw, 130px);
  }

  .stage-hidden {
    font-size: clamp(40px, 6vw, 56px);
    color: #9A9385;
    text-align: center;
  }

  .stage-hidden span {
    display: block;
    font-size: clamp(16px, 2vw, 20px);
    margin-top: 12px;
    color: #B3AC9C;
  }

  .progress {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 80vw;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
  }

  .dot.current { background: var(--paper); }

  footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding-top: 16px;
  }

  .nav-btn {
    font-family: inherit;
    font-size: clamp(16px, 2vw, 20px);
    font-weight: 500;
    background: rgba(255,255,255,0.08);
    color: var(--paper);
    border: 1px solid rgba(255,255,255,0.18);
    border-radius: 12px;
    padding: 14px 28px;
    cursor: pointer;
  }

  .nav-btn:active { transform: translateY(1px); }

  @media (max-width: 560px) {
    header { flex-direction: column; align-items: flex-start; }
    footer { gap: 14px; }
    .nav-btn { padding: 12px 18px; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="title">ការអានភាសាខ្មែរ · ថ្នាក់ទី៣</div>
    <nav class="level-tabs">
      <button class="tab active" data-level="letters">អក្សរ</button>
      <button class="tab" data-level="blending">ផ្សំសំឡេង</button>
      <button class="tab" data-level="words">ពាក្យ</button>
    </nav>
  </header>

  <main>
    <div class="hint">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
      </svg>
      <span id="hintText">សូមអានឮៗ ហើយឲ្យសិស្សអានតាម</span>
    </div>

    <div id="chipRow" class="chip-row" style="display:none;"></div>

    <div id="stage" class="stage">
      <div id="stageContent" class="stage-text"></div>
    </div>

    <div id="progress" class="progress"></div>
  </main>

  <footer>
    <button id="prevBtn" class="nav-btn">← មុន</button>
    <button id="nextBtn" class="nav-btn">បន្ទាប់ →</button>
  </footer>
</div>

<script>
  // ---- Content ----
  // To customize the word list later, just edit the `words` array below.
  const consonants = ["ក","ខ","គ","ឃ","ង","ច","ឆ","ជ","ឈ","ញ","ដ","ឋ","ឌ","ឍ","ណ","ត","ថ","ទ","ធ","ន","ប","ផ","ព","ភ","ម","យ","រ","ល","វ","ស","ហ","ឡ","អ"];

  const vowelSigns = ["ា","ិ","ី","ឹ","ឺ","ុ","ូ","ួ","ើ","ឿ","ៀ","េ","ែ","ៃ","ោ","ៅ"];

  const blendBases = ["ក","ម","ត","ន","ស"];

  const words = ["ឆ្កែ","ឆ្មា","មាន់","គោ","ជ្រូក","ត្រី","ដើមឈើ","ផ្កា","ផ្ទះ","សៀវភៅ","តុ","កៅអី","ទឹក","ភ្លៀង","ថ្ងៃ","ខែ"];

  // ---- State ----
  const state = {
    level: "letters",
    index: 0,
    blendBase: "ក",
    wordHidden: false
  };

  const hints = {
    letters: "សូមអានឮៗ ហើយឲ្យសិស្សអានតាម",
    blending: "អានព្យាង្គនេះឲ្យបានច្បាស់ បន្ទាប់មកឲ្យសិស្សអានតាម",
    words: "អានពាក្យនេះ រួចចុចលើប្រអប់ដើម្បីលាក់ ឬបង្ហាញឡើងវិញ"
  };

  // ---- Elements ----
  const stageEl = document.getElementById("stage");
  const stageContentEl = document.getElementById("stageContent");
  const progressEl = document.getElementById("progress");
  const chipRowEl = document.getElementById("chipRow");
  const hintTextEl = document.getElementById("hintText");
  const tabs = document.querySelectorAll(".tab");

  function currentItems() {
    if (state.level === "letters") return consonants;
    if (state.level === "blending") return [state.blendBase, ...vowelSigns.map(v => state.blendBase + v)];
    return words;
  }

  function render() {
    tabs.forEach(t => t.classList.toggle("active", t.dataset.level === state.level));
    hintTextEl.textContent = hints[state.level];

    chipRowEl.style.display = state.level === "blending" ? "flex" : "none";
    if (state.level === "blending") {
      chipRowEl.innerHTML = "";
      blendBases.forEach(b => {
        const chip = document.createElement("button");
        chip.className = "chip" + (b === state.blendBase ? " active" : "");
        chip.textContent = b;
        chip.onclick = () => {
          state.blendBase = b;
          state.index = 0;
          render();
        };
        chipRowEl.appendChild(chip);
      });
    }

    const items = currentItems();
    stageEl.classList.toggle("clickable", state.level === "words");

    if (state.level === "words" && state.wordHidden) {
      stageContentEl.className = "stage-hidden";
      stageContentEl.innerHTML = "?<span>ចុចដើម្បីមើលពាក្យ</span>";
    } else {
      stageContentEl.className = state.level === "words" ? "stage-text words-size" : "stage-text";
      stageContentEl.textContent = items[state.index];
    }

    progressEl.innerHTML = "";
    items.forEach((_, i) => {
      const dot = document.createElement("div");
      dot.className = "dot" + (i === state.index ? " current" : "");
      progressEl.appendChild(dot);
    });
  }

  function go(delta) {
    const items = currentItems();
    state.index = (state.index + delta + items.length) % items.length;
    state.wordHidden = false;
    render();
  }

  tabs.forEach(tab => {
    tab.onclick = () => {
      state.level = tab.dataset.level;
      state.index = 0;
      state.wordHidden = false;
      render();
    };
  });

  document.getElementById("prevBtn").onclick = () => go(-1);
  document.getElementById("nextBtn").onclick = () => go(1);

  stageEl.onclick = () => {
    if (state.level === "words") {
      state.wordHidden = !state.wordHidden;
      render();
    }
  };

  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") go(1);
    if (e.key === "ArrowLeft") go(-1);
  });

  render();
</script>

</body>
</html>
