<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ការសម្អាតថ្នាក់រៀន — មេរៀនទី៤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Moulpali&family=Battambang:wght@400;700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6E9;
    --rule:#C3D5E3;
    --margin:#D9776B;
    --ink:#1F3A5C;
    --ink-soft:#4C6786;
    --red:#C23B22;
    --board:#2B4A3A;
    --board-ink:#F2ECD8;
    --gold:#D9A441;
    --shadow: rgba(31,58,92,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Battambang', sans-serif;
    color:var(--ink);
    background:
      repeating-linear-gradient(var(--paper), var(--paper) 43px, var(--rule) 44px),
      var(--paper);
    background-attachment:local;
    min-height:100vh;
    position:relative;
    padding: 28px 28px 28px 64px;
  }
  body::before{
    content:"";
    position:fixed;
    top:0; bottom:0; left:44px;
    width:2px;
    background:var(--margin);
    opacity:0.55;
    z-index:0;
  }
  .wrap{max-width:1180px; margin:0 auto; position:relative; z-index:1;}

  /* ---------- Header ---------- */
  header{
    display:flex; justify-content:space-between; align-items:flex-end;
    flex-wrap:wrap; gap:16px;
    padding-bottom:14px;
    border-bottom:3px solid var(--ink);
    margin-bottom:22px;
  }
  .meta{
    font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    letter-spacing:0.04em; text-transform:uppercase; color:var(--ink-soft);
    margin-bottom:6px;
  }
  h1{
    font-family:'Moulpali', sans-serif;
    font-size:44px; margin:0; color:var(--ink); line-height:1.15;
    text-decoration: underline wavy var(--red) 3px;
    text-underline-offset:8px;
  }
  .day-tabs{display:flex; gap:10px;}
  .day-tab{
    font-family:'Inter',sans-serif; font-weight:700; font-size:15px;
    padding:10px 20px; border-radius:8px 8px 0 0;
    background:transparent; border:2px solid var(--ink); border-bottom:none;
    color:var(--ink); cursor:pointer; opacity:0.55;
  }
  .day-tab.active{ background:var(--ink); color:var(--paper); opacity:1;}

  /* ---------- Step rail ---------- */
  .rail{
    display:flex; gap:10px; overflow-x:auto; padding:6px 2px 18px;
    margin-bottom:6px;
  }
  .dot{
    flex:0 0 auto;
    font-family:'Inter',sans-serif; font-weight:700; font-size:13px;
    display:flex; align-items:center; gap:8px;
    padding:8px 14px; border-radius:999px;
    border:2px solid var(--ink-soft); color:var(--ink-soft);
    background:var(--paper); cursor:pointer; white-space:nowrap;
    transition:all .18s ease;
  }
  .dot .num{
    width:22px; height:22px; border-radius:50%;
    border:2px solid currentColor; display:flex; align-items:center; justify-content:center;
    font-size:12px;
  }
  .dot.active{ border-color:var(--red); color:var(--red); background:#FFF3EE; }
  .dot.active .num{ background:var(--red); color:var(--paper); border-color:var(--red); }
  .dot.done .num::after{ content:"✓"; }
  .dot.done{ color:var(--board); border-color:var(--board); }

  /* ---------- Stage ---------- */
  .stage{
    background:#fff;
    border:2px solid var(--ink);
    border-radius:14px;
    box-shadow:0 10px 0 var(--shadow);
    padding:32px 36px;
    min-height:420px;
    position:relative;
    animation:pageIn .32s ease;
  }
  @keyframes pageIn{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion: reduce){ .stage{animation:none;} }

  .stage-top{
    display:flex; justify-content:space-between; align-items:center;
    flex-wrap:wrap; gap:14px; margin-bottom:22px;
  }
  .stage-title{
    font-family:'Moulpali', sans-serif; font-size:30px; color:var(--ink);
    display:flex; align-items:center; gap:12px;
  }
  .stage-title .icon{font-size:34px;}

  .timer{
    font-family:'Inter',sans-serif; display:flex; align-items:center; gap:12px;
    background:var(--board); color:var(--board-ink); padding:8px 16px; border-radius:10px;
  }
  .timer .clock{font-size:22px; font-weight:700; min-width:64px; text-align:center;}
  .timer button{
    background:var(--gold); border:none; color:var(--ink); font-weight:700;
    width:34px; height:34px; border-radius:50%; cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .timer button.secondary{background:transparent; border:2px solid var(--board-ink); color:var(--board-ink);}
  .timer.done{background:var(--red);}
  .timer.done .clock{ animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.4;} }

  .content{font-size:19px; line-height:1.85;}
  .note{
    margin-top:20px; font-size:15px; color:var(--ink-soft);
    border-left:3px solid var(--gold); padding:8px 14px; background:#FFF9EC; border-radius:0 8px 8px 0;
  }
  .note b{color:var(--red);}

  /* ---------- Content type components ---------- */
  .board-line{
    background:var(--board); color:var(--board-ink); font-family:'Moulpali',sans-serif;
    font-size:24px; padding:18px 22px; border-radius:10px; text-align:center;
  }

  /* word map */
  .wordmap-wrap{display:flex; justify-content:center; padding:10px 0;}
  .branch-word{font-family:'Battambang',sans-serif; font-weight:700; font-size:20px; fill:var(--ink);}
  .center-word{font-family:'Moulpali',sans-serif; font-size:20px; fill:#fff;}

  /* syllables */
  .syll-row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:18px 0 8px;}
  .syll{
    font-family:'Moulpali',sans-serif; font-size:30px; color:var(--red);
    border:3px solid var(--red); border-radius:14px; padding:14px 24px;
  }
  .syll-plus{font-size:26px; color:var(--ink-soft); align-self:center;}

  /* flashcards */
  .card-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(210px,1fr)); gap:18px;}
  .flip-card{ perspective:1000px; height:150px; cursor:pointer;}
  .flip-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d;}
  .flip-card.flipped .flip-inner{transform:rotateY(180deg);}
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:12px; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:14px; font-weight:700;
  }
  .flip-front{background:var(--paper); border:2px dashed var(--ink-soft); font-family:'Moulpali',sans-serif; font-size:26px;}
  .flip-back{background:var(--ink); color:var(--paper); transform:rotateY(180deg); font-size:15px; font-weight:500; font-family:'Battambang',sans-serif;}

  /* pairs (antonym) */
  .pair-row{display:flex; align-items:center; justify-content:center; gap:20px; margin:14px 0; flex-wrap:wrap;}
  .pill{font-family:'Moulpali',sans-serif; font-size:24px; padding:12px 26px; border-radius:999px;}
  .pill.a{background:#E6F0EA; color:var(--board); border:2px solid var(--board);}
  .pill.b{background:#FCEAE6; color:var(--red); border:2px solid var(--red);}
  .vs{font-family:'Inter',sans-serif; font-weight:700; color:var(--ink-soft); font-size:14px;}

  /* homophones */
  .chip-row{display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
  .chip{
    font-family:'Moulpali',sans-serif; font-size:24px; padding:12px 22px; border-radius:12px;
    border:2px solid var(--ink-soft); cursor:pointer; position:relative;
  }
  .chip.correct{border-color:var(--board); background:#EAF4EE;}
  .chip.wrong{border-color:var(--red); background:#FBEAE6; opacity:0.7;}
  .chip .mark{position:absolute; top:-10px; right:-10px; font-size:16px;}

  /* passage / qa */
  .passage-box{background:var(--paper); border:2px dashed var(--ink-soft); border-radius:10px; padding:20px; font-size:20px; line-height:2;}
  .qa-item{margin-bottom:14px; padding:12px 16px; background:#F7F3E4; border-radius:10px;}
  .qa-item .key{font-family:'Inter',sans-serif; font-size:12px; color:var(--red); font-weight:700; text-transform:uppercase;}

  /* exercises */
  .ex-item{margin-bottom:16px; padding-bottom:16px; border-bottom:1px dashed var(--rule);}
  .ex-item:last-child{border:none;}
  .ex-num{font-family:'Moulpali',sans-serif; color:var(--red); margin-right:8px;}

  /* ---------- Footer nav ---------- */
  .footer-nav{
    display:flex; align-items:center; justify-content:space-between; margin-top:20px; gap:16px;
  }
  .nav-btn{
    font-family:'Inter',sans-serif; font-weight:700; font-size:15px;
    background:var(--ink); color:var(--paper); border:none; padding:12px 22px;
    border-radius:10px; cursor:pointer;
  }
  .nav-btn:disabled{opacity:0.3; cursor:default;}
  .progress-wrap{flex:1; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .progress-bar{width:100%; height:8px; background:var(--rule); border-radius:99px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--red); border-radius:99px; transition:width .3s;}
  .progress-label{font-family:'Inter',sans-serif; font-size:12px; color:var(--ink-soft);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="meta">ភាសាខ្មែរ • ថ្នាក់ទី៣ • មេរៀនទី៤</div>
      <h1>ការសម្អាតថ្នាក់រៀន</h1>
    </div>
    <div class="day-tabs" id="dayTabs"></div>
  </header>

  <div class="rail" id="rail"></div>

  <div class="stage" id="stage"></div>

  <div class="footer-nav">
    <button class="nav-btn" id="prevBtn">← មុន</button>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
    <button class="nav-btn" id="nextBtn">បន្ទាប់ →</button>
  </div>
</div>

          "អានពាក្យ ដោយមិនបាច់ផ្សំ និងប្រកប (សៀវភៅសិក្សា ទំព័រ១៤ លំហាត់ទី១)",
          "គូសសញ្ញាក្នុងប្រអប់ចម្លើយត្រឹមត្រូវ (លំហាត់ទី២)",
          "រៀបព្រឹត្តិការណ៍តាមលំដាប់ដោយដាក់លេខក្នុងប្រអប់ — ចម្លើយត្រឹមត្រូវ៖ ល.ប.ទី៤ → ល.ប.ទី៣ → ល.ប.ទី១ → ល.ប.ទី២"
        ], note:"សរសេរចម្លើយចូលសៀវភៅ។" },
    ]
  }
];

let dayIdx = 0, stepIdx = 0;
const timers = {}; // per "d-s" key: {remaining, running, intervalId}

function keyFor(d,s){ return d+"-"+s; }

function render(){
  renderTabs();
  renderRail();
  renderStage();
  renderFooter();
}

function renderTabs(){
  const el = document.getElementById('dayTabs');
  el.innerHTML = '';
  DAYS.forEach((d,i)=>{
    const b = document.createElement('button');
    b.className = 'day-tab' + (i===dayIdx?' active':'');
    b.textContent = d.label;
    b.onclick = ()=>{ dayIdx=i; stepIdx=0; render(); };
    el.appendChild(b);
  });
}

function renderRail(){
  const el = document.getElementById('rail');
  el.innerHTML = '';
  DAYS[dayIdx].steps.forEach((s,i)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (i===stepIdx?' active':'') + (i<stepIdx?' done':'');
    d.innerHTML = `<span class="num">${i+1}</span><span>${s.icon} ${s.title}</span>`;
    d.onclick = ()=>{ stepIdx=i; render(); };
    el.appendChild(d);
  });
}

function fmt(sec){
  const m = Math.floor(sec/60).toString().padStart(2,'0');
  const s = (sec%60).toString().padStart(2,'0');
  return m+':'+s;
}

function renderStage(){
  const step = DAYS[dayIdx].steps[stepIdx];
  const k = keyFor(dayIdx,stepIdx);
  if(!timers[k]) timers[k] = { remaining: step.minutes*60, running:false, intervalId:null };
  const t = timers[k];

  const stage = document.getElementById('stage');
  stage.innerHTML = `
    <div class="stage-top">
      <div class="stage-title"><span class="icon">${step.icon}</span>${step.title}</div>
      <div class="timer ${t.remaining<=0?'done':''}" id="timerBox">
        <button class="secondary" id="resetBtn">↺</button>
        <div class="clock" id="clock">${fmt(Math.max(t.remaining,0))}</div>
        <button id="playBtn">${t.running?'⏸':'▶'}</button>
      </div>
    </div>
    <div class="content" id="contentArea"></div>
    ${step.note ? `<div class="note">${step.note}</div>` : ''}
  `;

  renderContent(step);

  document.getElementById('playBtn').onclick = ()=>toggleTimer(k);
  document.getElementById('resetBtn').onclick = ()=>resetTimer(k, step.minutes);
}

function renderContent(step){
  const el = document.getElementById('contentArea');
  if(step.type === 'board'){
    el.innerHTML = `<div class="board-line">🖊 ${step.text}</div>`;
  }
  else if(step.type === 'wordmap'){
    const angleStep = 360/step.branches.length;
    let branchesSvg = '';
    step.branches.forEach((b,i)=>{
      const angle = (-90 + i*angleStep) * Math.PI/180;
      const x = 260 + Math.cos(angle)*170;
      const y = 120 + Math.sin(angle)*80;
      branchesSvg += `
        <line x1="260" y1="120" x2="${x}" y2="${y}" stroke="var(--ink-soft)" stroke-width="2" stroke-dasharray="6 5"/>
        <circle cx="${x}" cy="${y}" r="46" fill="#FCEAE6" stroke="var(--red)" stroke-width="2"/>
        <text x="${x}" y="${y+6}" text-anchor="middle" class="branch-word">${b}</text>
      `;
    });
    el.innerHTML = `<div class="wordmap-wrap"><svg width="520" height="240" viewBox="0 0 520 240">
        ${branchesSvg}
        <circle cx="260" cy="120" r="66" fill="var(--ink)"/>
        <text x="260" y="126" text-anchor="middle" class="center-word">${step.center}</text>
      </svg></div>`;
  }
  else if(step.type === 'syllables'){
    let row = '';
    step.syllables.forEach((s,i)=>{
      row += `<div class="syll">${s}</div>`;
      if(i < step.syllables.length-1) row += `<div class="syll-plus">–</div>`;
    });
    el.innerHTML = `<p style="text-align:center; font-size:22px;">ពាក្យ៖ <b>${step.word}</b></p><div class="syll-row">${row}</div>`;
  }
  else if(step.type === 'flashcards'){
    let cards = '';
    step.words.forEach((item,i)=>{
      cards += `
      <div class="flip-card" onclick="this.classList.toggle('flipped')">
        <div class="flip-inner">
          <div class="flip-face flip-front">${item.w}</div>
          <div class="flip-face flip-back">${item.h}</div>
        </div>
      </div>`;
    });
    el.innerHTML = `<div class="card-grid">${cards}</div>`;
  }
  else if(step.type === 'pairs'){
    let rows = '';
    step.pairs.forEach(p=>{
      rows += `<div class="pair-row"><div class="pill a">${p[0]}</div><div class="vs">≠</div><div class="pill b">${p[1]}</div></div>`;
    });
    el.innerHTML = rows;
  }
  else if(step.type === 'equal'){
    el.innerHTML = `<div class="pair-row"><div class="pill a">${step.left}</div><div class="vs">=</div><div class="pill a">${step.right}</div></div>`;
  }
  else if(step.type === 'homophones'){
    let chips = '';
    step.options.forEach((o,i)=>{
      chips += `<div class="chip" data-i="${i}" onclick="revealHomophone(this,${o.correct})">${o.w}</div>`;
    });
    el.innerHTML = `<p style="text-align:center;">តើពាក្យមួយណាត្រឹមត្រូវ?</p><div class="chip-row">${chips}</div>`;
  }
  else if(step.type === 'predict'){
    el.innerHTML = `<div class="passage-box" style="text-align:center; font-size:20px;">🖼️ ${step.question}</div>`;
  }
  else if(step.type === 'passage'){
    el.innerHTML = `<div class="passage-box">${step.placeholder}</div>`;
  }
  else if(step.type === 'qa'){
    let items = '';
    step.items.forEach(it=>{
      items += `<div class="qa-item"><div class="key">${it.key}</div>${it.q}</div>`;
    });
    el.innerHTML = items;
  }
  else if(step.type === 'exercises'){
    let items = '';
    step.items.forEach((it,i)=>{
      items += `<div class="ex-item"><span class="ex-num">${i+1}.</span>${it}</div>`;
    });
    el.innerHTML = items;
  }
}

function revealHomophone(node, correct){
  node.classList.add(correct?'correct':'wrong');
  node.innerHTML += `<span class="mark">${correct?'✓':'✕'}</span>`;
}

function toggleTimer(k){
  const t = timers[k];
  t.running = !t.running;
  if(t.running){
    t.intervalId = setInterval(()=>{
      t.remaining--;
      const clock = document.getElementById('clock');
      const box = document.getElementById('timerBox');
      if(clock) clock.textContent = fmt(Math.max(t.remaining,0));
      if(t.remaining<=0){
        clearInterval(t.intervalId);
        t.running = false;
        if(box) box.classList.add('done');
        const playBtn = document.getElementById('playBtn');
        if(playBtn) playBtn.textContent = '▶';
      }
    },1000);
  } else {
    clearInterval(t.intervalId);
  }
  renderStage();
}

function resetTimer(k, minutes){
  clearInterval(timers[k].intervalId);
  timers[k] = { remaining: minutes*60, running:false, intervalId:null };
  renderStage();
}

function renderFooter(){
  const steps = DAYS[dayIdx].steps;
  document.getElementById('prevBtn').disabled = (stepIdx===0);
  document.getElementById('nextBtn').disabled = (stepIdx===steps.length-1);
  const totalMin = steps.reduce((a,s)=>a+s.minutes,0);
  document.getElementById('progressFill').style.width = (((stepIdx+1)/steps.length)*100)+'%';
  document.getElementById('progressLabel').textContent = `សកម្មភាព ${stepIdx+1}/${steps.length} • សរុប ${totalMin} នាទី`;
}

document.getElementById('prevBtn').onclick = ()=>{ if(stepIdx>0){ stepIdx--; render(); } };
document.getElementById('nextBtn').onclick = ()=>{ if(stepIdx<DAYS[dayIdx].steps.length-1){ stepIdx++; render(); } };

document.addEventListener('keydown', (e)=>{
  if(e.key === 'ArrowRight') document.getElementById('nextBtn').click();
  if(e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key === ' '){ e.preventDefault(); const pb=document.getElementById('playBtn'); if(pb) pb.click(); }
});

render();
</script>
</body>
</html>
